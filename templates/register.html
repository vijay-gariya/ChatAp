{% extends "base.html" %}

{% block title %}Register - Real-time Chat{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass-effect rounded-2xl shadow-2xl p-8 hover-lift">

            <div class="text-center mb-8">
                <div class="bg-gradient-to-r from-purple-500 to-pink-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="user-plus" class="w-8 h-8 text-white"></i>
                </div>

                <h1 class="text-3xl font-bold text-white mb-2">
                    Create Account
                </h1>

                <p class="text-slate-300">
                    Register first to access Vjy's Chat Room
                </p>
            </div>

            <form id="registerForm" class="space-y-5">

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Username
                    </label>

                    <div class="relative">
                        <i data-lucide="user"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            minlength="3"
                            maxlength="20"
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                            placeholder="Choose a username"
                            required>
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Email Address
                    </label>

                    <div class="relative">
                        <i data-lucide="mail"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                            placeholder="Enter your email"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <i data-lucide="lock"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full pl-12 pr-12 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                            placeholder="Create password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">

                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <p id="passwordStrength"
                       class="text-xs mt-2 text-slate-400">
                    </p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Confirm Password
                    </label>

                    <div class="relative">
                        <i data-lucide="lock"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                            placeholder="Confirm password"
                            required>
                    </div>
                </div>

                <!-- Error -->
                <div id="errorMessage"
                     class="hidden p-3 bg-red-500/20 border border-red-500/30 rounded-xl text-red-200 text-sm">
                </div>

                <!-- Button -->
                <button
                    type="submit"
                    id="registerButton"
                    class="w-full bg-gradient-to-r from-purple-500 to-pink-600 text-white py-3 rounded-xl font-semibold hover:from-purple-600 hover:to-pink-700 transition-all">

                    Create Account
                </button>

            </form>

            <div class="text-center mt-6">
                <p class="text-slate-300">
                    Already have an account?

                    <a href="{{ url_for('login') }}"
                       class="text-purple-400 hover:text-purple-300 font-semibold">

                        Sign In
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

<script>

document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('errorMessage');
    const btn = document.getElementById('registerButton');

    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const strengthText = document.getElementById('passwordStrength');

    // Password Show/Hide
    document.getElementById('togglePassword').addEventListener('click', () => {

        const type =
            password.type === 'password'
            ? 'text'
            : 'password';

        password.type = type;
        confirmPassword.type = type;
    });

    // Password Strength
    password.addEventListener('input', () => {

        let value = password.value;

        if(value.length < 6){
            strengthText.innerText = "Weak Password";
        }
        else if(value.length < 10){
            strengthText.innerText = "Medium Password";
        }
        else{
            strengthText.innerText = "Strong Password";
        }
    });

    form.addEventListener('submit', async (e) => {

        e.preventDefault();

        errorBox.classList.add('hidden');

        const username =
            document.getElementById('username').value.trim();

        const email =
            document.getElementById('email').value.trim();

        if(username.length < 3){
            showError("Username must be at least 3 characters.");
            return;
        }

        if(password.value.length < 6){
            showError("Password must be at least 6 characters.");
            return;
        }

        if(password.value !== confirmPassword.value){
            showError("Passwords do not match.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Creating Account...";

        try{

            const response = await fetch(`${window.location.pathname}${window.location.search}`, {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    username,
                    email,
                    password:password.value
                })
            });

            const result = await response.json();

            if(result.success){

                alert("Account created successfully!");

                window.location.href =
                    result.redirect || "/login";

            }else{
                showError(result.error || "Registration failed");
            }

        }catch(err){

            showError("Server error. Please try again.");

        }finally{

            btn.disabled = false;
            btn.innerText = "Create Account";
        }
    });

    function showError(msg){
        errorBox.textContent = msg;
        errorBox.classList.remove('hidden');
    }

    lucide.createIcons();
});

</script>

{% endblock %}
