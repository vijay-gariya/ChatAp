{% extends "base.html" %}

{% block title %}Login - Real-time Chat{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass-effect rounded-2xl shadow-2xl p-8 hover-lift">

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="bg-gradient-to-r from-blue-500 to-purple-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="log-in" class="w-8 h-8 text-white"></i>
                </div>

                <h1 class="text-3xl font-bold text-white mb-2">
                    Welcome Back
                </h1>

                <p class="text-slate-300">
                    Sign in to enter Vjy's Chat Room
                </p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5">

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Email Address
                    </label>

                    <div class="relative">
                        <i data-lucide="mail"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Enter your email"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-200 mb-2">
                        Password
                    </label>

                    <div class="relative">
                        <i data-lucide="lock"
                           class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="w-full pl-12 pr-12 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">

                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 text-slate-300 text-sm">
                        <input
                            type="checkbox"
                            id="rememberMe"
                            class="rounded">

                        Remember Me
                    </label>

                    <a href="#"
                       class="text-blue-400 hover:text-blue-300 text-sm">
                        Forgot Password?
                    </a>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                     class="hidden p-3 bg-red-500/20 border border-red-500/30 rounded-xl text-red-200 text-sm">
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-xl font-semibold hover:from-blue-600 hover:to-purple-700 transition-all">

                    Sign In
                </button>

            </form>

            <!-- Register Link -->
            <div class="text-center mt-6">
                <p class="text-slate-300">
                    Don't have an account?

                    <a href="{{ url_for('register') }}"
                       class="text-blue-400 hover:text-blue-300 font-semibold">

                        Create Account
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

<script>

document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorMessage');
    const loginButton = document.getElementById('loginButton');

    const passwordInput =
        document.getElementById('password');

    // Show / Hide Password
    document.getElementById('togglePassword')
    .addEventListener('click', () => {

        const type =
            passwordInput.type === 'password'
            ? 'text'
            : 'password';

        passwordInput.type = type;
    });

    // Login Submit
    form.addEventListener('submit', async (e) => {

        e.preventDefault();

        errorBox.classList.add('hidden');

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        const rememberMe =
            document.getElementById('rememberMe').checked;

        loginButton.disabled = true;
        loginButton.innerText = "Signing In...";

        try {

            const response = await fetch(`${window.location.pathname}${window.location.search}`, {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    email,
                    password,
                    rememberMe
                })
            });

            const result = await response.json();

            if(result.success){

                window.location.href =
                    result.redirect || "/chat";

            } else {

                showError(
                    result.error ||
                    "Invalid email or password."
                );
            }

        } catch(error){

            showError(
                "Unable to connect to server. Please try again."
            );

        } finally {

            loginButton.disabled = false;
            loginButton.innerText = "Sign In";
        }
    });

    function showError(message){

        errorBox.textContent = message;
        errorBox.classList.remove('hidden');
    }

    lucide.createIcons();
});

</script>

{% endblock %}
